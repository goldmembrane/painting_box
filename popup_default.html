<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>__MSG_popup_title__</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        width: 300px;
        margin: 0;
        padding: 0;
      }
      .hidden {
        display: none;
      }
      .empty {
        height: 10px;
        width: 50px;
      }
      /* ✅ 다크모드 스타일 */
      .dark-mode {
        background-color: #1e1e1e;
        color: white;
      }

      .dark-mode button {
        background-color: #444;
        color: white;
      }
      .dark-mode button:hover {
        background-color: #666;
      }

      .dark-mode-textarea {
        background-color: #333; /* 다크모드 배경색 */
        color: white; /* 텍스트 색상 */
        border: 1px solid #555; /* 테두리 색상 */
      }

      .dark-mode-input {
        background-color: #333;
        color: white;
        border: 1px solid #555;
      }

      /* ✅ 다크모드 버튼 스타일 */
      #toggleDarkMode {
        background: transparent;
        border: none;
        font-size: 18px;
        cursor: pointer;
        transition: color 0.3s;
      }

      #addPresetBtn {
        border: none;
        font-size: 18px;
        cursor: pointer;
        background: transparent;
        color: #444;
      }

      #addPresetBtn:hover {
        background: #bbb;
      }

      .dark-mode #addPresetBtn {
        color: #fff;
      }

      .dark-mode #addPresetBtn:hover {
        background: #444;
      }

      #openSettingsBtn {
        border: none;
        font-size: 18px;
        cursor: pointer;
        background: transparent;
        color: #444;
      }

      #openSettingsBtn:hover {
        background: #bbb;
      }

      .dark-mode #openSettingsBtn {
        color: #fff;
      }

      .dark-mode #openSettingsBtn:hover {
        background: #444;
      }

      #subscriptionStatusContainer {
        display: flex;
        width: 100%;
        margin-top: 50px;
        align-items: center;
        justify-content: center;
      }

      .dark-mode #toggleDarkMode {
        color: white;
      }
      /* ✅ 다크모드 설정 화면 스타일 */
      .dark-mode #settingsScreen {
        background-color: #1e1e1e;
        color: white;
      }

      .dark-mode #settingsScreen p {
        color: #ccc;
      }

      .dark-mode #settingsScreen button {
        background-color: #444;
        color: white;
        border: 1px solid #666;
      }

      .dark-mode #settingsScreen button:hover {
        background-color: #666;
      }

      /* 네비게이션 바 스타일 */
      .navBar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
      }

      .navBar button {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
      }

      .back-btn {
        font-size: 16px;
        color: #444;
      }
      .back-btn:hover {
        background: #bbb;
      }

      .dark-mode .back-btn {
        color: #fff;
        font-size: 16px;
      }

      .dark-mode .back-btn:hover {
        background: #444;
      }

      .plus-btn {
        font-size: 16px;
        color: #444;
      }

      .plus-btn:hover {
        background: #bbb;
      }

      .dark-mode .plus-btn {
        color: #fff;
        font-size: 16px;
      }

      .dark-mode .plus-btn:hover {
        background: #444;
      }

      #subscriptionBanner {
        width: 100%;
        background-color: #ffeeba;
        color: #856404;
        border-bottom: 1px solid #ffc107;
        font-weight: bold;
        text-align: center;
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.5s ease, padding 0.5s ease;
        box-sizing: border-box;
        position: relative;
      }

      #closeBanner {
        position: absolute;
        right: 5px;
        top: 5px;
        color: gray !important;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        padding: 0;
        background: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .dark-mode #closeBanner {
        background: transparent;
      }

      .dark-mode #closeBanner:hover {
        background: transparent;
      }

      #subscriptionBanner.show {
        max-height: 100px;
        padding: 10px;
      }

      #subscriptionBanner button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
        margin-top: 5px;
      }

      #subscriptionBanner button:hover {
        background-color: #0056b3;
      }

      #mainContent {
        transition: margin-top 0.5s ease;
        margin-top: 0px;
        padding: 10px;
      }

      #mainContent.shifted {
        margin-top: 100px; /* 배너 높이만큼 밀어내기 */
      }

      #newPresetName {
        width: 95%;
        margin-bottom: 10px;
      }

      #importPresetName {
        width: 95%;
        margin-bottom: 10px;
      }

      /* 색상 띠 스타일 */
      .color-strip {
        display: flex;
        height: 20px;
        border-radius: 5px;
        overflow: hidden;
        margin-top: 5px;
      }

      .color-block {
        flex: 1;
        height: 100%;
      }
      .color-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .code-section {
        margin-top: 5px;
      }
      /* 코드 표시 공간 */
      .code-container {
        margin-top: 5px;
        display: none;
      }
      .copy-code {
        width: 100%;
        font-size: 12px;
        text-align: center;
      }
      .preset-preview {
        display: flex;
        align-items: center;
        margin-top: 5px;
      }
      /* ✅ 프리셋 상단 영역 (제목 + 삭제 버튼) */
      .preset-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      /* ✅ X(삭제) 버튼 스타일 */
      .delete-btn {
        background: none;
        border: none;
        color: gray;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        padding: 0;
      }
      .preset-item {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .color-preview {
        width: 20px;
        height: 20px;
        margin-right: 5px;
        border-radius: 50%;
      }
      .color-list-container {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .hidden {
        display: none;
      }
      .color-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px;
      }
      .color-container {
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .color-box {
        width: 30px;
        height: 30px;
        border-radius: 5px;
      }
      .color-name-input {
        margin-left: 5px;
        padding: 2px;
      }
      input {
        padding: 5px;
        margin-right: 5px;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
      }
      button:hover {
        background-color: #0056b3;
      }

      .delete-btn:hover {
        color: darkred;
        background: none;
      }

      .dark-mode .delete-btn {
        background: none;
        color: #fff;
      }

      .save-button {
        margin-top: 10px;
        padding: 5px;
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
      }
      /* ✅ 상세보기 화면에서 버튼 컨테이너 */
      .detail-buttons {
        position: fixed;
        bottom: 0px;
        left: 10px;
        right: 10px;
        background: white;
        border-radius: 5px;
      }

      .dark-mode .detail-footer-button {
        background: #444;
        color: white;
      }

      .dark-mode .detail-footer-button:hover {
        background: #666;
      }

      .dark-mode-footer {
        background-color: #333 !important;
        color: white !important;
        box-shadow: 0 -2px 5px rgba(255, 255, 255, 0.1);
      }

      #firstDetailButtons {
        display: flex;
        justify-content: space-between;
        padding: 10px;
      }

      #exportPresetDetail {
        padding: 0px 10px 10px 10px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #exportPresetBtn {
        padding: 8px 16px;
      }

      .dark-mode #exportPresetBtn {
        background: #444;
        color: white;
      }

      .dark-mode #exportPresetBtn:hover {
        background: #666;
      }

      /* ✅ 버튼 스타일 */
      .detail-buttons button {
        flex: 1;
        margin: 0 5px;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }

      .detail-buttons button:hover {
        background-color: #0056b3;
      }

      #savePreset {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #encryptedCodeInput {
        width: 98%;
        margin-bottom: 10px;
        resize: none;
      }

      #decodeAndSave {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .bottom-buttons {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #addColorToPreset {
        margin-left: 20px;
        padding: 8px 16px;
      }

      #backToDetail {
        padding: 8px 16px;
      }
    </style>
  </head>
  <body>
    <!-- ✅ 구독 배너 (초기에는 숨겨짐) -->
    <div id="subscriptionBanner" class="hidden">
      <button id="closeBanner">&times;</button>
      <p id="subscribe_prompt">🔒 __MSG_subscribe_prompt__</p>
      <button id="subscribeNow">__MSG_subscribe_button__</button>
    </div>

    <div id="mainContent">
      <!-- ✅ 메인 네비게이션 바 -->
      <div id="navBarMain" class="navBar">
        <h2 id="app_name">__MSG_app_name__</h2>
        <div>
          <button id="addPresetBtn">+</button>
          <button id="openSettingsBtn">⚙</button>
          <button id="toggleDarkMode">🌙</button>
        </div>
      </div>

      <!-- ✅ 새 프리셋 네비게이션 바 (초기 숨김) -->
      <div id="navBarNewPreset" class="navBar hidden">
        <button id="backToMain" class="back-btn">←</button>
        <h2 id="new_preset">__MSG_new_preset__</h2>
        <div class="empty"></div>
      </div>

      <div id="presetContainer">
        <h2 id="saved_presets">__MSG_saved_presets__</h2>
        <div id="presetList"></div>
      </div>

      <div id="newPresetScreen" class="hidden">
        <!-- 🎨 프리셋 이름만 받아 생성 -->
        <div class="section">
          <h3 id="create_new_preset">__MSG_create_new_preset__</h3>
          <input
            type="text"
            id="newPresetName"
            placeholder="__MSG_enter_preset_name__"
          />
          <button id="savePreset">__MSG_create_preset_button__</button>
        </div>

        <!-- 🔑 암호화된 코드와 이름을 입력하여 생성 -->
        <div class="section">
          <h3 id="import_from_code">__MSG_import_from_code__</h3>
          <input
            type="text"
            id="importPresetName"
            placeholder="__MSG_enter_preset_name__"
          />
          <textarea
            id="encryptedCodeInput"
            placeholder="__MSG_enter_encrypted_code__"
            rows="3"
          ></textarea>
          <button id="decodeAndSave">__MSG_import_code_button__</button>
        </div>
      </div>

      <!-- ⚙ 설정 화면 -->

      <div id="navBarSetting" class="navBar hidden">
        <button id="backToMainFromSettings" class="back-btn">←</button>
        <h2 id="setting">설정</h2>
        <div class="empty"></div>
      </div>

      <div id="settingsScreen" class="hidden">
        <p id="inqury_text">__MSG_inqury_text__</p>
        <strong>paletteboxofficial@gmail.com</strong
        ><span id="to_inqury_text">__MSG_to_inqury_text__</span>

        <div id="subscriptionStatusContainer">
          <button id="subscribeBtn" class="hidden">
            🔔 __MSG_subscribe_button__
          </button>
          <button id="unsubscribeBtn" class="hidden">
            ❌ __MSG_cancel_subscribe_button__
          </button>
        </div>
      </div>

      <div id="navBarDetail" class="navBar hidden">
        <button id="backToMainPage" class="back-btn">←</button>
        <span id="presetDetailTitle">__MSG_preset_detail__</span>
        <button id="addColorBtn" class="plus-btn">+</button>
      </div>

      <div id="presetDetails" class="hidden">
        <h2 id="presetTitle"></h2>
        <div id="colorList"></div>

        <div class="detail-buttons" id="presetDetailFooter">
          <div id="firstDetailButtons">
            <button id="toggleEditMode" class="detail-footer-button">
              __MSG_edit_names__
            </button>
            <button id="sendToCode" class="detail-footer-button">
              __MSG_export_code_button__
            </button>
          </div>
          <div id="exportPresetDetail">
            <button id="exportPresetBtn"></button>
          </div>
        </div>
      </div>

      <div id="addColorScreen" class="hidden">
        <h2 id="add_color_into_preset_title"></h2>

        <div style="margin-top: 20px">
          <input type="color" id="colorPicker" />
          <input
            type="text"
            id="newColorName"
            placeholder="색상 이름 (선택사항)"
            style="margin-left: 10px"
          />

          <div class="bottom-buttons" id="presetDetailFooter">
            <button id="backToDetail" class="detail-footer-button"></button>
            <button id="addColorToPreset" class="detail-footer-button"></button>
          </div>
        </div>
      </div>
    </div>

    <script src="popup_default.js"></script>
  </body>
</html>
