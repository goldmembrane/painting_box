<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>__MSG_popup_title__</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        width: 300px;
        margin: 0;
        padding: 0;
      }
      .empty {
        height: 10px;
        width: 50px;
      }
      /* ✅ 다크모드 스타일 */
      .dark-mode {
        background-color: #1e1e1e;
        color: white;
      }

      .dark-mode button {
        background-color: #444;
        color: white;
      }
      .dark-mode button:hover {
        background-color: #666;
      }

      .dark-mode-textarea {
        background-color: #333; /* 다크모드 배경색 */
        color: white; /* 텍스트 색상 */
        border: 1px solid #555; /* 테두리 색상 */
      }

      .dark-mode-input {
        background-color: #333;
        color: white;
        border: 1px solid #555;
      }

      /* ✅ 다크모드 버튼 스타일 */
      #toggleDarkMode {
        background: transparent;
        border: none;
        font-size: 18px;
        cursor: pointer;
        transition: color 0.3s;
      }

      #addPresetBtn {
        border: none;
        font-size: 18px;
        cursor: pointer;
        background: transparent;
        color: #444;
      }

      #addPresetBtn:hover {
        background: #bbb;
      }

      .dark-mode #addPresetBtn {
        color: #fff;
      }

      .dark-mode #addPresetBtn:hover {
        background: #444;
      }

      #openSettingsBtn {
        border: none;
        font-size: 18px;
        cursor: pointer;
        background: transparent;
        color: #444;
      }

      #openSettingsBtn:hover {
        background: #bbb;
      }

      .dark-mode #openSettingsBtn {
        color: #fff;
      }

      .dark-mode #openSettingsBtn:hover {
        background: #444;
      }

      #subscriptionStatusContainer {
        display: flex;
        width: 100%;
        margin-top: 50px;
        align-items: center;
        justify-content: center;
      }

      .dark-mode #toggleDarkMode {
        color: white;
      }
      /* ✅ 다크모드 설정 화면 스타일 */
      .dark-mode #settingsScreen {
        background-color: #1e1e1e;
        color: white;
      }

      .dark-mode #settingsScreen p {
        color: #ccc;
      }

      .dark-mode #settingsScreen button {
        background-color: #444;
        color: white;
        border: 1px solid #666;
      }

      .dark-mode #settingsScreen button:hover {
        background-color: #666;
      }

      /* 네비게이션 바 스타일 */
      .navBar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
      }

      .navBar button {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
      }

      .back-btn {
        font-size: 16px;
        color: #444;
      }
      .back-btn:hover {
        background: #bbb;
      }

      .dark-mode .back-btn {
        color: #fff;
        font-size: 16px;
      }

      .dark-mode .back-btn:hover {
        background: #444;
      }

      .plus-btn {
        font-size: 16px;
        color: #444;
      }

      .plus-btn:hover {
        background: #bbb;
      }

      .dark-mode .plus-btn {
        color: #fff;
        font-size: 16px;
      }

      .dark-mode .plus-btn:hover {
        background: #444;
      }

      #subscriptionBanner {
        width: 100%;
        background-color: #ffeeba;
        color: #856404;
        border-bottom: 1px solid #ffc107;
        font-weight: bold;
        text-align: center;
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.5s ease, padding 0.5s ease;
        box-sizing: border-box;
        position: relative;
      }

      #closeBanner {
        position: absolute;
        right: 5px;
        top: 5px;
        color: gray !important;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        padding: 0;
        background: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .dark-mode #closeBanner {
        background: transparent;
      }

      .dark-mode #closeBanner:hover {
        background: transparent;
      }

      #subscriptionBanner.show {
        max-height: 100px;
        padding: 10px;
      }

      #subscriptionBanner button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
        margin-top: 5px;
      }

      #subscriptionBanner button:hover {
        background-color: #0056b3;
      }

      #mainContent {
        transition: margin-top 0.5s ease;
        margin-top: 0px;
        padding: 10px;
      }

      #mainContent.shifted {
        margin-top: 100px; /* 배너 높이만큼 밀어내기 */
      }

      #newPresetName {
        width: 95%;
        margin-bottom: 10px;
      }

      #importPresetName {
        width: 95%;
        margin-bottom: 10px;
      }

      /* 색상 띠 스타일 */
      .color-strip {
        display: flex;
        height: 20px;
        border-radius: 5px;
        overflow: hidden;
        margin-top: 5px;
      }

      .color-block {
        flex: 1;
        height: 100%;
      }
      .color-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .code-section {
        margin-top: 5px;
      }
      /* 코드 표시 공간 */
      .code-container {
        margin-top: 5px;
        display: none;
      }
      .copy-code {
        width: 100%;
        font-size: 12px;
        text-align: center;
      }
      .preset-preview {
        display: flex;
        align-items: center;
        margin-top: 5px;
      }
      /* ✅ 프리셋 상단 영역 (제목 + 삭제 버튼) */
      .preset-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      /* ✅ X(삭제) 버튼 스타일 */
      .delete-btn {
        background: none;
        border: none;
        color: gray;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        padding: 0;
      }
      .preset-item {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .color-preview {
        width: 20px;
        height: 20px;
        margin-right: 5px;
        border-radius: 50%;
      }
      .color-list-container {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .color-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px;
      }
      .color-container {
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .color-box {
        width: 30px;
        height: 30px;
        border-radius: 5px;
      }
      .color-name-input {
        margin-left: 5px;
        padding: 2px;
      }
      input {
        padding: 5px;
        margin-right: 5px;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
      }
      button:hover {
        background-color: #0056b3;
      }

      .delete-btn:hover {
        color: darkred;
        background: none;
      }

      .dark-mode .delete-btn {
        background: none;
        color: #fff;
      }

      .save-button {
        margin-top: 10px;
        padding: 5px;
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
      }
      /* ✅ 상세보기 화면에서 버튼 컨테이너 */
      .detail-buttons {
        position: fixed;
        bottom: 0px;
        left: 10px;
        right: 10px;
        background: white;
        border-radius: 5px;
      }

      .dark-mode .detail-footer-button {
        background: #444;
        color: white;
      }

      .dark-mode .detail-footer-button:hover {
        background: #666;
      }

      .dark-mode-footer {
        background-color: #333 !important;
        color: white !important;
        box-shadow: 0 -2px 5px rgba(255, 255, 255, 0.1);
      }

      #firstDetailButtons {
        display: flex;
        justify-content: space-between;
        padding: 10px;
      }

      #exportPresetDetail {
        padding: 0px 10px 10px 10px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #exportPresetBtn {
        padding: 8px 16px;
      }

      .dark-mode #exportPresetBtn {
        background: #444;
        color: white;
      }

      .dark-mode #exportPresetBtn:hover {
        background: #666;
      }

      /* ✅ 버튼 스타일 */
      .detail-buttons button {
        flex: 1;
        margin: 0 5px;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }

      .detail-buttons button:hover {
        background-color: #0056b3;
      }

      #savePreset {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #encryptedCodeInput {
        width: 98%;
        margin-bottom: 10px;
        resize: none;
      }

      #decodeAndSave {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .bottom-buttons {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #addColorToPreset {
        margin-left: 20px;
        padding: 8px 16px;
      }

      #backToDetail {
        padding: 8px 16px;
      }
      /* 색상 조합 컨테이너 css*/
      .color-gen-container {
        padding: 16px;
        border-bottom: 1px solid #ddd;
        font-family: sans-serif;
        position: relative;
      }

      .color-gen-inner {
        margin-bottom: 12px;
      }

      .color-gen-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .color-gen-icon {
        width: 16px;
        height: 16px;
        color: #3b82f6;
      }

      .color-gen-title {
        font-size: 14px;
        font-weight: 500;
        margin: 0;
      }

      .color-gen-block {
        margin-bottom: 12px;
      }

      .color-gen-label {
        font-size: 12px;
        font-weight: 500;
        display: block;
        margin-bottom: 4px;
      }

      .color-gen-select {
        width: 100%;
        height: 32px;
        font-size: 12px;
        padding: 4px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .color-gen-button {
        width: 100%;
        height: 32px;
        font-size: 12px;
        background-color: #3b82f6;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
      /* 생성된 색상 조합 container css */
      .generated-palette-container {
        margin-top: 16px;
        background-color: white;
        padding: 8px;
        border-radius: 8px;
        font-family: sans-serif;
      }

      .dark-mode .generated-palette-container {
        background-color: #3c3c3c;
        color: white;
      }

      .palette-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: bold;
        font-size: 14px;
      }

      .palette-subtitle {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 4px;
        margin-bottom: 8px;
      }

      .palette-colors {
        display: flex;
        height: 20px;
        border-radius: 5px;
        overflow: hidden;
        margin-top: 5px;
        margin-bottom: 8px;
      }

      .palette-color {
        flex: 1;
        height: 100%;
      }

      .palette-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .palette-footer .buttons {
        display: flex;
        gap: 8px;
      }

      .palette-footer button {
        font-size: 12px;
        padding: 4px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .palette-footer .save-btn {
        background-color: #3b82f6;
        color: white;
      }

      .dark-mode .palette-footer .save-btn {
        background: #888;
      }

      .palette-footer .detail-btn {
        background-color: #1e293b;
        color: white;
        border: 1px solid #334155;
      }

      .palette-footer .close-btn {
        background: none;
        color: #64748b;
        font-size: 16px;
      }
      /* ui 색상 조합 기준 색 선택 관련 css */
      .color-picker-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      #colorWheelCanvas {
        cursor: default;
      }

      .brightness-slider input {
        width: 180px;
      }

      .color-preview {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid #ccc;
      }

      .hidden {
        display: none;
      }

      #generated-palette-container {
        display: none; /* 처음엔 숨김 */
      }

      .dark-mode-select {
        background-color: #333; /* 다크모드 배경색 */
        color: white; /* 텍스트 색상 */
        border: 1px solid #555;
      }

      .dark-mode-option {
        background-color: #555; /* 다크모드 배경색 */
        color: white; /* 텍스트 색상 */
      }

      .hidden {
        display: none;
      }

      .today-palette {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        background-color: #f8fafc;
        border: 1px solid #94a3b8;
        border-radius: 8px;
        min-height: 220px;
        padding: 12px;
        z-index: 999;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .dark-mode .today-palette {
        background-color: #1e1e1e;
      }

      .today-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .today-title {
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
      }

      .dark-mode .today-title {
        color: white;
      }

      .today-content {
        margin-top: 8px;
        height: 130px;
        align-items: center;
        text-align: center;
        display: flex;
        justify-content: center;
        flex-direction: column;
      }

      .today-colors {
        display: flex;
        height: 20px;
        min-width: 250px;
        border-radius: 5px;
        overflow: hidden;
      }

      .today-colors div {
        flex: 1;
        height: 100%;
      }

      .today-save-btn {
        margin-top: 10px;
        width: 100%;
      }

      .today-footer {
        font-size: 12px;
        color: #475569;
        position: absolute;
        gap: 6px;
        bottom: 10px;
        left: 10px;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 16px;
        cursor: pointer;
        color: #64748b;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- ✅ 구독 배너 (초기에는 숨겨짐) -->
    <div id="subscriptionBanner" class="hidden">
      <button id="closeBanner">&times;</button>
      <p id="subscribe_prompt">🔒 __MSG_subscribe_prompt__</p>
      <button id="subscribeNow">__MSG_subscribe_button__</button>
    </div>

    <div id="mainContent">
      <!-- ✅ 메인 네비게이션 바 -->
      <div id="navBarMain" class="navBar">
        <h2 id="app_name">__MSG_app_name__</h2>
        <div>
          <button id="addPresetBtn">+</button>
          <button id="openSettingsBtn">⚙</button>
          <button id="toggleDarkMode">🌙</button>
        </div>
      </div>

      <!-- ✅ 새 프리셋 네비게이션 바 (초기 숨김) -->
      <div id="navBarNewPreset" class="navBar hidden">
        <button id="backToMain" class="back-btn">←</button>
        <h2 id="new_preset">__MSG_new_preset__</h2>
        <div class="empty"></div>
      </div>

      <!-- 색상 조합 container -->
      <div id="color-generation-container" class="color-gen-container">
        <div class="color-gen-inner">
          <div class="color-gen-header">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="h-4 w-4"
              style="color: #3b82f6"
            >
              <rect width="7" height="9" x="3" y="3" rx="1"></rect>
              <rect width="7" height="5" x="14" y="3" rx="1"></rect>
              <rect width="7" height="9" x="14" y="12" rx="1"></rect>
              <rect width="7" height="5" x="3" y="16" rx="1"></rect>
            </svg>
            <h3 class="color-gen-title">색상 조합 생성</h3>
          </div>

          <div class="color-gen-block">
            <label for="generation-method" class="color-gen-label"
              >생성 방식
            </label>
            <select id="generation-method" class="color-gen-select">
              <option value="">방식을 선택하세요</option>
              <option value="preset">기존 프리셋 기반</option>
              <option value="keyword">키워드</option>
              <option value="ui">UI 디자인</option>
            </select>
          </div>

          <div id="preset-option-container" class="color-gen-block hidden">
            <label for="preset-option" class="color-gen-label"
              >기준 프리셋 선택</label
            >
            <select id="preset-option" class="color-gen-select">
              <option value="">프리셋을 선택하세요</option>
            </select>
          </div>

          <div id="keyword-option-container" class="color-gen-block hidden">
            <label for="keyword-option" class="color-gen-label">키워드</label>
            <select id="keyword-option" class="color-gen-select">
              <option value="">키워드를 선택하세요</option>
              <option value="nature">자연</option>
              <option value="city">도시</option>
              <option value="food">음식</option>
              <option value="emotion">감정</option>
              <option value="spring">봄</option>
              <option value="summer">여름</option>
              <option value="autumn">가을</option>
              <option value="winter">겨울</option>
              <option value="vintage">빈티지</option>
              <option value="modern">모던</option>
              <option value="warm">따뜻함</option>
              <option value="cool">시원함</option>
              <option value="bright">밝음</option>
              <option value="dark">어두움</option>
              <option value="calm">잔잔함</option>
              <option value="dynamic">역동적인</option>
            </select>

            <label for="color-count-input" class="color-gen-label"
              >색상 개수</label
            >
            <input
              id="color-count-input"
              class="color-gen-select"
              type="number"
              min="2"
              max="10"
              value="5"
            />
          </div>

          <div
            class="color-picker-container hidden"
            id="color-picker-container"
          >
            <canvas id="colorWheelCanvas" width="200" height="200"></canvas>

            <div class="brightness-slider">
              <input
                type="range"
                min="0"
                max="100"
                value="50"
                id="brightnessSlider"
              />
            </div>

            <div class="color-preview" id="colorPreview"></div>
          </div>

          <button id="generate-palette-btn" class="color-gen-button">
            팔레트 생성
          </button>
        </div>
      </div>

      <div
        id="generated-palette-container"
        class="generated-palette-container"
      ></div>

      <!-- 오늘의 색상 추천 popup -->
      <div id="today-palette-banner" class="today-palette hidden">
        <div class="today-header">
          <h3 class="today-title">🎯 오늘의 색상 조합</h3>
          <button id="close-today-banner" class="close-btn">✕</button>
        </div>
        <div class="today-content">
          <div id="today-colors" class="today-colors"></div>
          <button id="today-save-btn" class="today-save-btn">
            프리셋에 저장
          </button>
        </div>
        <div class="today-footer">
          <label>
            <input type="checkbox" id="suppressTodayBanner" />
            오늘 하루만 보지 않기
          </label>
        </div>
      </div>

      <!-- 저장된 프리셋 container -->
      <div id="presetContainer">
        <h2 id="saved_presets">__MSG_saved_presets__</h2>
        <div id="presetList"></div>
      </div>

      <div id="newPresetScreen" class="hidden">
        <!-- 🎨 프리셋 이름만 받아 생성 -->
        <div class="section">
          <h3 id="create_new_preset">__MSG_create_new_preset__</h3>
          <input
            type="text"
            id="newPresetName"
            placeholder="__MSG_enter_preset_name__"
          />
          <button id="savePreset">__MSG_create_preset_button__</button>
        </div>

        <!-- 🔑 암호화된 코드와 이름을 입력하여 생성 -->
        <div class="section">
          <h3 id="import_from_code">__MSG_import_from_code__</h3>
          <input
            type="text"
            id="importPresetName"
            placeholder="__MSG_enter_preset_name__"
          />
          <textarea
            id="encryptedCodeInput"
            placeholder="__MSG_enter_encrypted_code__"
            rows="3"
          ></textarea>
          <button id="decodeAndSave">__MSG_import_code_button__</button>
        </div>
      </div>

      <!-- ⚙ 설정 화면 -->

      <div id="navBarSetting" class="navBar hidden">
        <button id="backToMainFromSettings" class="back-btn">←</button>
        <h2 id="setting">설정</h2>
        <div class="empty"></div>
      </div>

      <div id="settingsScreen" class="hidden">
        <p id="inqury_text">__MSG_inqury_text__</p>
        <strong>paletteboxofficial@gmail.com</strong
        ><span id="to_inqury_text">__MSG_to_inqury_text__</span>

        <div id="subscriptionStatusContainer">
          <button id="subscribeBtn" class="hidden">
            🔔 __MSG_subscribe_button__
          </button>
          <button id="unsubscribeBtn" class="hidden">
            ❌ __MSG_cancel_subscribe_button__
          </button>
        </div>
      </div>

      <!-- 프리셋 상세 화면 -->
      <div id="navBarDetail" class="navBar hidden">
        <button id="backToMainPage" class="back-btn">←</button>
        <span id="presetDetailTitle">__MSG_preset_detail__</span>
        <button id="addColorBtn" class="plus-btn">+</button>
      </div>

      <div id="presetDetails" class="hidden">
        <h2 id="presetTitle"></h2>
        <div id="colorList"></div>

        <div class="detail-buttons" id="presetDetailFooter">
          <div id="firstDetailButtons">
            <button id="toggleEditMode" class="detail-footer-button">
              __MSG_edit_names__
            </button>
            <button id="sendToCode" class="detail-footer-button">
              __MSG_export_code_button__
            </button>
          </div>
          <div id="exportPresetDetail">
            <button id="exportPresetBtn"></button>
          </div>
        </div>
      </div>

      <div id="addColorScreen" class="hidden">
        <h2 id="add_color_into_preset_title"></h2>

        <div style="margin-top: 20px">
          <input type="color" id="colorPicker" />
          <input
            type="text"
            id="newColorName"
            placeholder="색상 이름 (선택사항)"
            style="margin-left: 10px"
          />

          <div class="bottom-buttons" id="presetDetailFooter">
            <button id="backToDetail" class="detail-footer-button"></button>
            <button id="addColorToPreset" class="detail-footer-button"></button>
          </div>
        </div>
      </div>
    </div>

    <script src="popup_default.js"></script>
  </body>
</html>
