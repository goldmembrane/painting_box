<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>색상 프리셋</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        width: 300px;
      }
      #subscriptionBanner {
        background-color: #ffeeba;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ffc107;
        color: #856404;
        text-align: center;
        font-weight: bold;
        margin-bottom: 10px;
      }

      #subscriptionBanner button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
        margin-top: 5px;
      }

      #subscriptionBanner button:hover {
        background-color: #0056b3;
      }
      .preset-preview {
        display: flex;
        align-items: center;
        margin-top: 5px;
      }
      .preset-item {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .color-preview {
        width: 20px;
        height: 20px;
        margin-right: 5px;
        border-radius: 50%;
      }
      .color-list-container {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .hidden {
        display: none;
      }
      .color-item {
        display: flex;
        align-items: center;
        margin-top: 5px;
      }
      .color-box {
        width: 30px;
        height: 30px;
        border-radius: 5px;
        border: 1px solid #ddd;
      }
      .color-name-input {
        margin-left: 5px;
        padding: 2px;
      }
      input {
        padding: 5px;
        margin-right: 5px;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
      }
      button:hover {
        background-color: #0056b3;
      }
      .save-button {
        margin-top: 10px;
        padding: 5px;
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- ✅ 구독 배너 (초기에는 숨겨짐) -->
    <div id="subscriptionBanner" class="hidden">
      <p>🔒 더 많은 기능을 사용하려면 구독이 필요합니다!</p>
      <button id="subscribeNow">구독하기</button>
    </div>

    <h2>프리셋 생성</h2>
    <input type="text" id="presetName" placeholder="프리셋 이름 입력" />
    <button id="savePreset">프리셋 생성</button>

    <h3>암호화된 코드 입력</h3>
    <input type="text" id="encryptedCodeInput" placeholder="코드 입력" />
    <button id="decodeAndSave">코드 프리셋 저장</button>

    <h2>저장된 프리셋</h2>
    <div id="presetList"></div>

    <div id="presetDetails" class="hidden">
      <h2 id="presetTitle"></h2>
      <div id="colorList"></div>
      <button id="toggleEditMode" class="save-button">이름 변경</button>
      <button id="backToList" class="save-button">뒤로가기</button>
    </div>

    <h3>암호화된 코드</h3>
    <input type="text" id="encryptedCode" readonly />

    <script src="popup_default.js"></script>
  </body>
</html>
