<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>색상 프리셋</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        width: 300px;
      }
      .preset-item {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        margin-bottom: 10px;
      }
      .color-preview {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .color-box {
        width: 30px;
        height: 30px;
        border-radius: 5px;
        border: 1px solid #ddd;
      }
      input {
        padding: 5px;
        margin-right: 5px;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <h2>프리셋 생성</h2>
    <input type="text" id="presetName" placeholder="프리셋 이름 입력" />
    <button id="savePreset">프리셋 생성</button>

    <h2>저장된 프리셋</h2>
    <div id="presetList"></div>

    <script src="popup_default.js"></script>
  </body>
</html>
