<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>색 추출 결과</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
      }
      #colorList {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .color-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: center;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #f8f8f8;
      }
      .group-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        cursor: pointer;
        font-weight: bold;
      }
      .color-preview {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid #000;
        margin-right: 10px;
      }
      .toggle-button {
        background: none;
        border: none;
        color: blue;
        cursor: pointer;
        font-size: 14px;
      }
      .color-list-container {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        width: 100%;
      }
      .color-box-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .color-box {
        width: 60px;
        height: 60px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
      .selected-colors-container {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 10px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #f9f9f9;
      }
      .selected-color-list-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .selected-color-information {
        display: flex;
        align-items: center;
      }
      .selected-color {
        width: 40px;
        height: 40px;
        border-radius: 5px;
        border: 1px solid #ddd;
        position: relative;
      }
      .remove-btn {
        background: red;
        color: white;
        border: none;
        font-size: 14px;
        padding: 5px 10px;
        font-size: 10px;
        cursor: pointer;
      }
      .hex-text {
        font-size: 14px;
        font-weight: bold;
        margin-left: 10px;
      }
      select,
      input {
        padding: 5px;
        margin-bottom: 10px;
        width: 100%;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
      }
      button.selected {
        background-color: #28a745; /* 초록색으로 변경 */
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <h2>캡처된 이미지</h2>
    <div id="capturedImageContainer"></div>
    <h2>추출된 색상</h2>
    <div id="colorList"></div>

    <h2>선택된 색상들</h2>
    <div id="selectedColorsList" class="selected-colors-container"></div>

    <h2>프리셋 선택</h2>
    <select id="presetDropdown">
      <option value="">프리셋 선택</option>
    </select>

    <div id="newPresetContainer" style="display: none">
      <h3>새로운 프리셋 이름</h3>
      <input type="text" id="newPresetName" placeholder="새 프리셋 이름 입력" />
    </div>

    <button id="saveSelectedColors">프리셋에 저장</button>

    <script src="popup.js"></script>
  </body>
</html>
