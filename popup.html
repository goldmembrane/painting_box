<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>색 추출 결과</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        width: 600px;
      }

      .hidden {
        display: none;
      }
      .top-navigator {
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
      .whole-container {
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .extract-mode-container {
        display: flex;
        flex-direction: column;
        flex: 0.5;
      }
      .extract-container {
        display: flex;
        flex-direction: column;
        flex: 0.4;
      }
      #colorList {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .color-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: center;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #f8f8f8;
      }
      .dark-mode .color-group {
        background-color: #b2b2b2;
      }
      .group-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        cursor: pointer;
        font-weight: bold;
      }
      .color-preview {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid #000;
        margin-right: 10px;
      }
      .toggle-button {
        background: none;
        border: none;
        color: gray;
        cursor: pointer;
        font-size: 14px;
      }
      .toggle-button:hover {
        background: none;
      }
      .dark-mode .toggle-button {
        background: none;
        color: black;
      }
      .color-list-container {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        width: 100%;
      }
      .color-box-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
        width: 100%;
      }
      .color-info-container {
        display: flex;
        align-items: center;
      }
      .color-box {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        border: 1px solid #ddd;
        margin-right: 10px;
      }
      .selected-colors-container {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 10px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #f9f9f9;
      }
      .dark-mode .selected-colors-container {
        background-color: #b2b2b2;
      }

      .select-all-button {
        margin: 10px;
        padding: 5px 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .select-all-button:hover {
        background-color: #0056b3;
      }
      .selected-color-list-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .selected-color-information {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .selected-color {
        width: 50px;
        height: 50px;
        border-radius: 5px;
        border: 1px solid #ddd;
        margin-right: 10px;
      }
      .remove-btn {
        background: #ef4444;
        color: white;
        border: none;
        padding: 5px 10px;
        font-size: 20px;
        cursor: pointer;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hex-text {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 0px;
      }
      select,
      input {
        padding: 5px;
        margin-bottom: 10px;
        outline: none;
      }
      .dropdown-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #presetDropdown {
        width: 70%;
        margin-bottom: 0px;
      }
      .preset-name-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #newPresetName {
        width: 70%;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
      }
      button.selected {
        background-color: #28a745; /* 초록색으로 변경 */
      }
      button:hover {
        background-color: #0056b3;
      }
      .scroll-btn {
        position: fixed;
        right: 10px;
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
        z-index: 1000;
        background-color: #007bff;
        color: white;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      }

      .scroll-btn:hover {
        background-color: #0056b3;
      }

      #scrollToTop {
        bottom: 80px;
        display: none;
      }

      #scrollToBottom {
        bottom: 40px;
      }
      .color-select-btn {
        padding: 5px 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .color-select-btn.selected {
        background-color: #28a745;
      }
    </style>
  </head>
  <body>
    <!-- ✅ 구독 배너 (초기에는 숨겨짐) -->
    <div id="subscriptionBanner" class="hidden">
      <p>🔒 더 많은 기능을 사용하려면 구독이 필요합니다!</p>
      <button id="subscribeNow">구독하기</button>
    </div>

    <div class="top-navigator">
      <button id="toggleDarkMode">🌙</button>
    </div>

    <div class="whole-container">
      <div class="extract-mode-container">
        <h2>캡처된 이미지</h2>
        <div id="capturedImageContainer"></div>
      </div>

      <div class="extract-container">
        <h2>추출된 색상</h2>
        <div id="colorList"></div>
      </div>
    </div>

    <h2>선택된 색상들</h2>
    <div id="selectedColorsList" class="selected-colors-container"></div>

    <h2>프리셋 선택</h2>

    <div class="dropdown-container">
      <select id="presetDropdown">
        <option value="">프리셋 선택</option>
      </select>

      <button id="saveSelectedColors">프리셋에 저장</button>
    </div>

    <h3>새로운 프리셋 생성</h3>

    <div class="preset-name-container">
      <input type="text" id="newPresetName" placeholder="새 프리셋 이름 입력" />

      <button id="saveSelectedNewPresetColors">프리셋에 저장</button>
    </div>

    <!-- ✅ 맨 위로 & 맨 아래로 이동 버튼 -->
    <button id="scrollToTop" class="scroll-btn fixed-btn">⬆</button>
    <button id="scrollToBottom" class="scroll-btn fixed-btn">⬇</button>
    <script src="popup.js"></script>
  </body>
</html>
